<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator | CyberShield</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:linear-gradient(135deg,#081b29,#0d3b66,#081b29);
    min-height:100vh;
    color:white;
}

/* Navbar */

nav{

    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    position:fixed;
    top:0;
    z-index:1000;
}

.logo{

    font-size:28px;
    font-weight:700;
    color:#00d9ff;
}

nav ul{

    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li{

    cursor:pointer;
}

nav ul li a{

    text-decoration:none;
    color:white;
    transition:.3s;
}

nav ul li a:hover{

    color:#00d9ff;
}

/* Hero */

.hero{

    padding-top:130px;
    text-align:center;
}

.hero h1{

    font-size:48px;
    margin-bottom:10px;
}

.hero p{

    color:#ddd;
    font-size:18px;
}

/* Generator Card */

.generator-card{

    width:90%;
    max-width:700px;
    margin:50px auto;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:35px;
    backdrop-filter:blur(20px);
}

/* Generated Password */

.password-box{

    display:flex;
    margin-top:25px;
    gap:10px;
}

#generatedPassword{

    flex:1;
    padding:15px;
    border:none;
    outline:none;
    border-radius:10px;
    font-size:18px;
    background:white;
    color:black;
}

.copy-btn{

    width:100px;
    margin-top:0;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00d9ff;
    color:black;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.copy-btn:hover{

    background:white;
}

/* Settings */

.setting{

    margin-top:25px;
}

.setting label{

    display:block;
    margin-bottom:10px;
    font-size:16px;
}

input[type="range"]{

    width:100%;
    cursor:pointer;
}

.options{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

.option{

    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:10px;
}

.option label{

    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
    cursor:pointer;
}

.option input{

    width:18px;
    height:18px;
}

/* Generate Button */

.generate-btn{

    width:100%;
    padding:15px;
    margin-top:30px;
    border:none;
    border-radius:10px;
    background:#00d9ff;
    color:black;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.generate-btn:hover{

    background:white;
}

/* Strength */

.strength{

    margin-top:25px;
    text-align:center;
    font-size:20px;
    font-weight:600;
}

footer{

    margin-top:80px;
    text-align:center;
    padding:20px;
    background:rgba(255,255,255,.05);
}

@media(max-width:700px){

    nav{

        padding:20px 5%;
    }

    nav ul{

        gap:12px;
        font-size:13px;
    }

    .logo{

        font-size:22px;
    }

    .hero h1{

        font-size:34px;
    }

    .options{

        grid-template-columns:1fr;
    }

    .password-box{

        flex-direction:column;
    }

    .copy-btn{

        width:100%;
    }

}

</style>

</head>

<body>

<!-- Navbar -->

<nav>

<div class="logo">CyberShield</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="index.html">Analyzer</a></li>

<li><a href="generator.html">Generator</a></li>

<li><a href="index.html#tips">Security Tips</a></li>

<li><a href="index.html">About</a></li>

</ul>

</nav>


<!-- Hero -->

<section class="hero">

<h1>Password Generator</h1>

<p>Create a strong and secure password instantly.</p>

</section>


<!-- Generator -->

<div class="generator-card">

<h2>Generate Your Password</h2>


<!-- Generated Password -->

<div class="password-box">

<input
    type="text"
    id="generatedPassword"
    placeholder="Your generated password"
    readonly
>

<button class="copy-btn" onclick="copyPassword()">
Copy
</button>

</div>


<!-- Password Length -->

<div class="setting">

<label>
Password Length:
<strong id="lengthValue">16</strong>
</label>

<input
    type="range"
    id="length"
    min="8"
    max="32"
    value="16"
    oninput="updateLength()"
>

</div>


<!-- Options -->

<div class="options">

<div class="option">

<label>

<input type="checkbox" id="uppercase" checked>

Uppercase Letters

</label>

</div>


<div class="option">

<label>

<input type="checkbox" id="lowercase" checked>

Lowercase Letters

</label>

</div>


<div class="option">

<label>

<input type="checkbox" id="numbers" checked>

Numbers

</label>

</div>


<div class="option">

<label>

<input type="checkbox" id="symbols" checked>

Symbols

</label>

</div>

</div>


<!-- Generate -->

<button class="generate-btn" onclick="generatePassword()">

🔐 Generate Strong Password

</button>


<div class="strength" id="strength">

Password strength: —

</div>

</div>


<footer>

© 2026 Password Strength & Breach Detection System

</footer>


<script>

function updateLength(){

    const length = document.getElementById("length").value;

    document.getElementById("lengthValue").textContent = length;

}


function generatePassword(){

    const length = parseInt(
        document.getElementById("length").value
    );

    const useUppercase =
        document.getElementById("uppercase").checked;

    const useLowercase =
        document.getElementById("lowercase").checked;

    const useNumbers =
        document.getElementById("numbers").checked;

    const useSymbols =
        document.getElementById("symbols").checked;


    let characters = "";

    if(useUppercase){

        characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    }

    if(useLowercase){

        characters += "abcdefghijklmnopqrstuvwxyz";

    }

    if(useNumbers){

        characters += "0123456789";

    }

    if(useSymbols){

        characters += "!@#$%^&*()_+-=[]{}|;:,.<>?";

    }


    if(characters.length === 0){

        alert("Please select at least one character type.");

        return;

    }


    let password = "";

    const randomArray = new Uint32Array(length);

    crypto.getRandomValues(randomArray);


    for(let i = 0; i < length; i++){

        password += characters[
            randomArray[i] % characters.length
        ];

    }


    document.getElementById("generatedPassword").value = password;

    checkGeneratedStrength(password);

}


function copyPassword(){

    const password =
        document.getElementById("generatedPassword").value;


    if(password === ""){

        alert("Generate a password first.");

        return;

    }


    navigator.clipboard.writeText(password);


    const button = document.querySelector(".copy-btn");

    button.textContent = "Copied!";


    setTimeout(function(){

        button.textContent = "Copy";

    },1500);

}


function checkGeneratedStrength(password){

    let score = 0;


    if(password.length >= 8)
        score++;


    if(/[A-Z]/.test(password))
        score++;


    if(/[a-z]/.test(password))
        score++;


    if(/[0-9]/.test(password))
        score++;


    if(/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password))
        score++;


    const strength =
        document.getElementById("strength");


    if(score <= 2){

        strength.textContent =
            "Password strength: 🔴 Weak";

    }

    else if(score === 3){

        strength.textContent =
            "Password strength: 🟠 Medium";

    }

    else if(score === 4){

        strength.textContent =
            "Password strength: 🔵 Strong";

    }

    else{

        strength.textContent =
            "Password strength: 🟢 Very Strong";

    }

}


generatePassword();

</script>

</body>

</html>
